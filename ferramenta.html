<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora – Amostragem Documental</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --bg: #f6f8fa;
            --surface: #ffffff;
            --text: #1a1a2e;
            --text-secondary: #4a4a6a;
            --border: #e2e8f0;
            --primary: #2563eb;
            --primary-light: #60a5fa;
            --primary-dark: #1e3a8a;
            --shadow: 0 8px 30px rgba(0,0,0,0.05);
            --radius: 16px;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 0 20px 40px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        nav {
            padding: 24px 0 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }
        .logo {
            font-weight: 700;
            font-size: 1.4rem;
            color: var(--primary-dark);
            letter-spacing: -0.5px;
        }
        .logo i { color: var(--primary-light); margin-right: 8px; }
        .nav-links {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .nav-links a {
            padding: 8px 16px;
            border-radius: 40px;
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .nav-links a:hover {
            background: var(--surface);
            color: var(--primary);
            box-shadow: var(--shadow);
        }
        .nav-links a.active {
            background: var(--primary);
            color: white;
        }
        .card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 28px 32px;
            box-shadow: var(--shadow);
            margin: 24px 0;
            border: 1px solid var(--border);
        }
        .card h2 {
            margin-top: 0;
            font-weight: 600;
            font-size: 1.8rem;
            color: var(--primary-dark);
        }
        .badge {
            background: var(--primary-light);
            color: white;
            border-radius: 40px;
            padding: 2px 14px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            text-decoration: none;
            font-family: var(--font);
        }
        .btn:hover { background: var(--primary-dark); }
        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }
        .btn-outline:hover {
            background: var(--primary);
            color: white;
        }
        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: end;
            margin-bottom: 16px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            flex: 1 1 180px;
        }
        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .form-group input {
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            font-family: var(--font);
            background: white;
            transition: border 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .form-group input[type="number"] {
            -moz-appearance: textfield;
        }
        .form-group input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
        }
        .estrato-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }
        .estrato-item:last-child { border-bottom: none; }
        .estrato-info {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }
        .estrato-info strong {
            color: var(--text-secondary);
            font-weight: 500;
        }
        .estrato-info span {
            font-weight: 600;
        }
        .result-box {
            background: var(--bg);
            padding: 20px 24px;
            border-radius: var(--radius);
            margin: 20px 0;
            border-left: 4px solid var(--primary-light);
        }
        .seed-control {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            margin: 16px 0;
        }
        .seed-control label {
            font-weight: 600;
            color: var(--text-secondary);
        }
        .seed-control input {
            width: 120px;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
        }
        .table-wrap { overflow-x: auto; margin: 16px 0; }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }
        th {
            background: var(--bg);
            text-align: left;
            padding: 10px 14px;
            font-weight: 600;
            color: var(--text-secondary);
            border-bottom: 2px solid var(--border);
        }
        td {
            padding: 8px 14px;
            border-bottom: 1px solid var(--border);
        }
        tr:last-child td { border-bottom: none; }
        .text-muted { color: var(--text-secondary); }
        .mt-16 { margin-top: 16px; }
        @media (max-width: 640px) {
            .card { padding: 20px; }
            .form-row { flex-direction: column; align-items: stretch; }
            .form-group { flex: 1; }
            .nav-links a { padding: 6px 12px; font-size: 0.8rem; }
        }
        footer {
            margin-top: 48px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
<div class="container">
    <nav>
        <div class="logo"><i class="fas fa-archive"></i> AmostragemDoc</div>
        <div class="nav-links">
            <a href="index.html"><i class="fas fa-home"></i> Início</a>
            <a href="manual-simplificado.html"><i class="fas fa-book"></i> Manual Simpl.</a>
            <a href="manual-completo.html"><i class="fas fa-file-alt"></i> Manual Completo</a>
            <a href="ferramenta.html" class="active"><i class="fas fa-calculator"></i> Calculadora</a>
            <a href="formulario.html"><i class="fas fa-file-pdf"></i> Formulário</a>

        </div>
    </nav>

    <div class="card">
        <h2><i class="fas fa-calculator" style="color: var(--primary-light);"></i> Calculadora de Amostragem</h2>
        <p class="text-muted">Ferramenta interativa que implementa o fluxo completo do manual.</p>

        <div style="margin: 24px 0;">
            <div class="form-row">
                <div class="form-group">
                    <label>Nome do estrato (ex.: 03.02/2019)</label>
                    <input type="text" id="estratoNome" placeholder="Código/Ano">
                </div>
                <div class="form-group">
                    <label>População (N<sub>i</sub>)</label>
                    <input type="number" id="estratoPop" placeholder="Número de unidades" min="1">
                </div>
                <button class="btn" id="btnAddEstrato"><i class="fas fa-plus"></i> Adicionar</button>
            </div>
            <div id="listaEstratos" style="margin: 12px 0;"></div>
        </div>

        <div class="seed-control">
            <label for="seedInput"><i class="fas fa-dice"></i> Semente (seed):</label>
            <input type="number" id="seedInput" value="42" min="0" step="1">
            <button class="btn btn-outline" id="btnRandomSeed"><i class="fas fa-random"></i> Aleatória</button>
        </div>

        <button class="btn" id="btnCalcular" style="width: 100%; justify-content: center; margin: 8px 0 16px;">
            <i class="fas fa-play"></i> Calcular Amostra
        </button>

        <div id="resultados" style="display: none;">
            <div class="result-box" id="resumoGlobal"></div>
            <div class="table-wrap" id="tabelaAlocacao"></div>
            <div id="detalhesSorteados"></div>
            <button class="btn btn-outline" id="btnExportCSV"><i class="fas fa-file-csv"></i> Exportar CSV</button>
        </div>
    </div>

    <footer>
        <p>Baseado no Decreto 48.897/2004 e IN APE/SAESP 3/2015 – Ferramenta de cálculo.</p>
    </footer>
</div>

<script>
    // ============================================================
    // GERENCIAMENTO DE ESTRATOS
    // ============================================================
    let estratos = [];
    const listaEstratosEl = document.getElementById('listaEstratos');
    const btnAdd = document.getElementById('btnAddEstrato');
    const inputNome = document.getElementById('estratoNome');
    const inputPop = document.getElementById('estratoPop');

    function renderEstratos() {
        if (estratos.length === 0) {
            listaEstratosEl.innerHTML = `<p class="text-muted" style="padding:12px 0;">Nenhum estrato adicionado.</p>`;
            return;
        }
        let html = '';
        estratos.forEach((e, idx) => {
            html += `
                <div class="estrato-item">
                    <div class="estrato-info">
                        <strong>${e.nome}</strong>
                        <span>N<sub>i</sub> = ${e.pop}</span>
                    </div>
                    <button class="btn btn-remover" data-index="${idx}" style="padding:4px 14px; font-size:0.85rem; background:#e63946; color:white; border:none; border-radius:40px; cursor:pointer;">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </div>
            `;
        });
        listaEstratosEl.innerHTML = html;
        document.querySelectorAll('.btn-remover').forEach(btn => {
            btn.addEventListener('click', function() {
                const idx = parseInt(this.dataset.index);
                estratos.splice(idx, 1);
                renderEstratos();
                document.getElementById('resultados').style.display = 'none';
            });
        });
    }

    btnAdd.addEventListener('click', function() {
        const nome = inputNome.value.trim();
        const pop = parseInt(inputPop.value);
        if (!nome) { alert('Informe o nome do estrato.'); return; }
        if (!pop || pop < 1) { alert('Informe uma população válida (≥ 1).'); return; }
        if (estratos.some(e => e.nome === nome)) {
            alert('Já existe um estrato com este nome.');
            return;
        }
        estratos.push({ nome, pop });
        renderEstratos();
        inputNome.value = '';
        inputPop.value = '';
        document.getElementById('resultados').style.display = 'none';
    });

    inputNome.addEventListener('keypress', (e) => { if (e.key === 'Enter') btnAdd.click(); });
    inputPop.addEventListener('keypress', (e) => { if (e.key === 'Enter') btnAdd.click(); });

    // ============================================================
    // GERADOR PSEUDOALEATÓRIO (mulberry32)
    // ============================================================
    function mulberry32(a) {
        return function() {
            a |= 0; a = a + 0x6D2B79F5 | 0;
            let t = Math.imul(a ^ a >>> 15, 1 | a);
            t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
            return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
    }

    // ============================================================
    // CÁLCULO PRINCIPAL
    // ============================================================
    document.getElementById('btnCalcular').addEventListener('click', function() {
        if (estratos.length === 0) {
            alert('Adicione pelo menos um estrato.');
            return;
        }

        const N = estratos.reduce((s, e) => s + e.pop, 0);
        const n0 = 384.16;
        let n = n0 / (1 + (n0 - 1) / N);
        n = Math.round(n);

        let aloc = estratos.map(e => {
            const raw = n * e.pop / N;
            let arred = Math.round(raw);
            if (arred < 1) arred = 1;
            return { ...e, raw, arred, resto: raw - Math.floor(raw) };
        });

        let somaAtual = aloc.reduce((s, a) => s + a.arred, 0);
        if (somaAtual > n) {
            let dif = somaAtual - n;
            const candidatos = aloc.map((a, idx) => ({ idx, arred: a.arred, resto: a.resto }));
            candidatos.sort((a, b) => a.resto - b.resto);
            for (let c of candidatos) {
                if (dif === 0) break;
                if (aloc[c.idx].arred > 1) {
                    aloc[c.idx].arred -= 1;
                    dif--;
                }
            }
        } else if (somaAtual < n) {
            let dif = n - somaAtual;
            const candidatos = aloc.map((a, idx) => ({ idx, arred: a.arred, resto: a.resto }));
            candidatos.sort((a, b) => b.resto - a.resto);
            for (let c of candidatos) {
                if (dif === 0) break;
                aloc[c.idx].arred += 1;
                dif--;
            }
        }
        somaAtual = aloc.reduce((s, a) => s + a.arred, 0);
        while (somaAtual < n) {
            for (let i = 0; i < aloc.length && somaAtual < n; i++) {
                aloc[i].arred += 1;
                somaAtual++;
            }
        }
        while (somaAtual > n) {
            for (let i = aloc.length - 1; i >= 0 && somaAtual > n; i--) {
                if (aloc[i].arred > 1) {
                    aloc[i].arred -= 1;
                    somaAtual--;
                }
            }
        }

        const seed = parseInt(document.getElementById('seedInput').value) || 42;
        const rand = mulberry32(seed);

        aloc.forEach(a => {
            const p = Math.floor(a.arred * 0.8);
            a.P = p;
            a.Q = a.arred - p;
        });

        aloc.forEach(a => {
            const N_i = a.pop;
            const P = a.P;
            if (P === 0) { a.sorteados = []; return; }
            const K = N_i / P;
            const r = rand() * K;
            const posicoes = [];
            for (let j = 1; j <= P; j++) {
                const pos = Math.ceil(r + (j - 1) * K);
                if (pos <= N_i) posicoes.push(pos);
            }
            while (posicoes.length < P) {
                const extra = Math.floor(rand() * N_i) + 1;
                if (!posicoes.includes(extra)) posicoes.push(extra);
            }
            a.sorteados = posicoes.slice(0, P);
        });

        exibirResultados(N, n, aloc, seed);
    });

    function exibirResultados(N, n, aloc, seed) {
        const resultadosDiv = document.getElementById('resultados');
        resultadosDiv.style.display = 'block';

        const totalPreservado = aloc.reduce((s, a) => s + a.arred, 0);
        document.getElementById('resumoGlobal').innerHTML = `
            <strong>População total (N):</strong> ${N} &nbsp;|&nbsp;
            <strong>n (Cochran):</strong> ${n} &nbsp;|&nbsp;
            <strong>Estratos:</strong> ${aloc.length} &nbsp;|&nbsp;
            <strong>Total preservado:</strong> ${totalPreservado} &nbsp;|&nbsp;
            <strong>Seed:</strong> ${seed}
        `;

        let html = `<table>
            <thead><tr>
                <th>Estrato</th>
                <th>N<sub>i</sub></th>
                <th>n<sub>i</sub></th>
                <th>P (prob.)</th>
                <th>Q (qual.)</th>
                <th>Posições sorteadas (P)</th>
            </tr></thead><tbody>`;
        aloc.forEach(a => {
            const sorteadosStr = a.sorteados.length > 0 ? a.sorteados.join(', ') : '—';
            html += `<tr>
                <td><strong>${a.nome}</strong></td>
                <td>${a.pop}</td>
                <td>${a.arred}</td>
                <td>${a.P}</td>
                <td>${a.Q}</td>
                <td style="font-size:0.85rem; max-width:300px; word-break:break-all;">${sorteadosStr}</td>
            </tr>`;
        });
        html += `</tbody></table>`;
        document.getElementById('tabelaAlocacao').innerHTML = html;

        let detalhesHtml = `<div style="margin-top:20px;"><h4><i class="fas fa-list-ul"></i> Detalhamento dos sorteios</h4>`;
        aloc.forEach(a => {
            if (a.sorteados.length > 0) {
                detalhesHtml += `<div style="background:var(--bg);padding:8px 16px;border-radius:8px;margin:8px 0;">
                    <strong>${a.nome}</strong> (P = ${a.P}): ${a.sorteados.join(', ')}
                </div>`;
            }
        });
        detalhesHtml += `</div>`;
        document.getElementById('detalhesSorteados').innerHTML = detalhesHtml;

        window._dadosExport = { N, n, aloc, seed };
    }

    document.getElementById('btnExportCSV').addEventListener('click', function() {
        const dados = window._dadosExport;
        if (!dados) { alert('Nenhum resultado para exportar.'); return; }
        let csv = 'Estrato,Ni,ni_Alocado,P,Q,Posicoes_Sorteadas\n';
        dados.aloc.forEach(a => {
            const sort = a.sorteados.join(';');
            csv += `${a.nome},${a.pop},${a.arred},${a.P},${a.Q},"${sort}"\n`;
        });
        csv += `\nResumo,População Total,${dados.N},n (Cochran),${dados.n},Seed,${dados.seed}\n`;
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'amostragem_resultados.csv';
        link.click();
        URL.revokeObjectURL(link.href);
    });

    document.getElementById('btnRandomSeed').addEventListener('click', function() {
        const seed = Math.floor(Math.random() * 1000000);
        document.getElementById('seedInput').value = seed;
    });

    // Exemplos iniciais
    const exemplos = [
        { nome: '03.02/2019', pop: 1200 },
        { nome: '03.02/2020', pop: 1800 },
        { nome: '03.02/2021', pop: 2000 },
        { nome: '03.02/2022', pop: 1500 }
    ];
    estratos = exemplos;
    renderEstratos();
    document.getElementById('seedInput').value = 42;
</script>
</body>
</html>
